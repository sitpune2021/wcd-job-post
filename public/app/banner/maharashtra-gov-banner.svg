<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#eaf2fc" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#dce9f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d3e4f6" stop-opacity="1"/>
    </linearGradient>

    <!-- Building Shadow & Highlights -->
    <linearGradient id="bldgFacade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="360" fill="url(#skyGrad)"/>

  <!-- Maharashtra Map Watermark in Background -->
  <g opacity="0.32" transform="translate(680, 50) scale(0.62)">
    <path d="M120,40 C140,20 180,30 200,50 C230,60 260,40 290,60 C320,70 340,110 360,130 C380,160 370,200 390,230 C370,250 350,280 320,300 C290,320 250,310 220,340 C190,350 160,330 130,320 C100,310 80,270 70,230 C60,190 70,160 80,120 C90,80 100,60 120,40 Z" fill="#93c5fd" />
    <text x="210" y="200" font-family="'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="4" opacity="0.75">महाराष्ट्र</text>
  </g>

  <!-- Clouds -->
  <g opacity="0.55" fill="#ffffff">
    <ellipse cx="480" cy="90" rx="90" ry="24"/>
    <ellipse cx="530" cy="80" rx="60" ry="28"/>
    <ellipse cx="760" cy="110" rx="100" ry="22"/>
  </g>

  <!-- Secretariat Architecture (Mantralaya / Vidhan Bhavan complex) -->
  <g transform="translate(250, 40)">
    <!-- Base podium / steps -->
    <rect x="0" y="270" width="640" height="15" fill="#94a3b8" rx="2"/>
    <rect x="20" y="285" width="600" height="12" fill="#64748b" rx="1"/>

    <!-- Left Wing -->
    <rect x="40" y="160" width="180" height="110" fill="url(#bldgFacade)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Left Wing Roof Cornice -->
    <rect x="35" y="152" width="190" height="8" fill="url(#roofGrad)" rx="1"/>
    <rect x="30" y="145" width="200" height="7" fill="#64748b" rx="1"/>
    <!-- Left Wing Windows Grid -->
    <g fill="#475569" opacity="0.7">
      <rect x="55" y="170" width="14" height="24" rx="2"/><rect x="80" y="170" width="14" height="24" rx="2"/><rect x="105" y="170" width="14" height="24" rx="2"/><rect x="130" y="170" width="14" height="24" rx="2"/><rect x="155" y="170" width="14" height="24" rx="2"/><rect x="180" y="170" width="14" height="24" rx="2"/>
      <rect x="55" y="205" width="14" height="24" rx="2"/><rect x="80" y="205" width="14" height="24" rx="2"/><rect x="105" y="205" width="14" height="24" rx="2"/><rect x="130" y="205" width="14" height="24" rx="2"/><rect x="155" y="205" width="14" height="24" rx="2"/><rect x="180" y="205" width="14" height="24" rx="2"/>
      <rect x="55" y="240" width="14" height="24" rx="2"/><rect x="80" y="240" width="14" height="24" rx="2"/><rect x="105" y="240" width="14" height="24" rx="2"/><rect x="130" y="240" width="14" height="24" rx="2"/><rect x="155" y="240" width="14" height="24" rx="2"/><rect x="180" y="240" width="14" height="24" rx="2"/>
    </g>

    <!-- Right Wing -->
    <rect x="420" y="160" width="180" height="110" fill="url(#bldgFacade)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Right Wing Roof Cornice -->
    <rect x="415" y="152" width="190" height="8" fill="url(#roofGrad)" rx="1"/>
    <rect x="410" y="145" width="200" height="7" fill="#64748b" rx="1"/>
    <!-- Right Wing Windows Grid -->
    <g fill="#475569" opacity="0.7">
      <rect x="435" y="170" width="14" height="24" rx="2"/><rect x="460" y="170" width="14" height="24" rx="2"/><rect x="485" y="170" width="14" height="24" rx="2"/><rect x="510" y="170" width="14" height="24" rx="2"/><rect x="535" y="170" width="14" height="24" rx="2"/><rect x="560" y="170" width="14" height="24" rx="2"/>
      <rect x="435" y="205" width="14" height="24" rx="2"/><rect x="460" y="205" width="14" height="24" rx="2"/><rect x="485" y="205" width="14" height="24" rx="2"/><rect x="510" y="205" width="14" height="24" rx="2"/><rect x="535" y="205" width="14" height="24" rx="2"/><rect x="560" y="205" width="14" height="24" rx="2"/>
      <rect x="435" y="240" width="14" height="24" rx="2"/><rect x="460" y="240" width="14" height="24" rx="2"/><rect x="485" y="240" width="14" height="24" rx="2"/><rect x="510" y="240" width="14" height="24" rx="2"/><rect x="535" y="240" width="14" height="24" rx="2"/><rect x="560" y="240" width="14" height="24" rx="2"/>
    </g>

    <!-- Center Main Block -->
    <rect x="205" y="130" width="230" height="140" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <!-- Center Entablature / Pediment Arch -->
    <rect x="195" y="120" width="250" height="10" fill="url(#roofGrad)" rx="1"/>
    <path d="M210,120 L320,80 L430,120 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>

    <!-- Grand Entrance Colonier / Pilasters -->
    <g fill="#cbd5e1" stroke="#94a3b8" stroke-width="1">
      <rect x="225" y="135" width="12" height="135" rx="1"/>
      <rect x="255" y="135" width="12" height="135" rx="1"/>
      <rect x="285" y="135" width="12" height="135" rx="1"/>
      <rect x="345" y="135" width="12" height="135" rx="1"/>
      <rect x="375" y="135" width="12" height="135" rx="1"/>
      <rect x="405" y="135" width="12" height="135" rx="1"/>
    </g>

    <!-- Center Grand Arch Doorway -->
    <path d="M305,270 L305,210 C305,198 335,198 335,210 L335,270 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>

    <!-- Center Windows -->
    <g fill="#334155" opacity="0.8">
      <rect x="230" y="145" width="16" height="24" rx="2"/><rect x="260" y="145" width="16" height="24" rx="2"/><rect x="365" y="145" width="16" height="24" rx="2"/><rect x="395" y="145" width="16" height="24" rx="2"/>
      <rect x="230" y="180" width="16" height="24" rx="2"/><rect x="260" y="180" width="16" height="24" rx="2"/><rect x="365" y="180" width="16" height="24" rx="2"/><rect x="395" y="180" width="16" height="24" rx="2"/>
    </g>

    <!-- Central Dome Structure -->
    <!-- Dome Base Drum -->
    <rect x="275" y="45" width="90" height="36" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" rx="2"/>
    <g fill="#475569" opacity="0.75">
      <rect x="284" y="52" width="7" height="18" rx="1"/>
      <rect x="299" y="52" width="7" height="18" rx="1"/>
      <rect x="317" y="52" width="7" height="18" rx="1"/>
      <rect x="333" y="52" width="7" height="18" rx="1"/>
      <rect x="349" y="52" width="7" height="18" rx="1"/>
    </g>
    <!-- Dome Cupola -->
    <path d="M272,45 C272,-10 368,-10 368,45 Z" fill="url(#domeGrad)" stroke="#64748b" stroke-width="1.8"/>
    <!-- Dome Finial/Spire -->
    <line x1="320" y1="-8" x2="320" y2="-45" stroke="#334155" stroke-width="3"/>
    <circle cx="320" cy="-45" r="4" fill="#f59e0b"/>

    <!-- Flagpole & Indian Tricolor Flag -->
    <line x1="320" y1="-45" x2="320" y2="-88" stroke="#475569" stroke-width="2.5"/>
    <circle cx="320" cy="-88" r="3" fill="#e2e8f0"/>
    
    <!-- Indian National Flag -->
    <g transform="translate(321, -86)">
      <!-- Saffron -->
      <path d="M0,0 C15,-3 35,3 52,-1 L52,11 C35,15 15,9 0,12 Z" fill="#FF9933"/>
      <!-- White -->
      <path d="M0,12 C15,9 35,15 52,11 L52,23 C35,27 15,21 0,24 Z" fill="#FFFFFF"/>
      <!-- Green -->
      <path d="M0,24 C15,21 35,27 52,23 L52,35 C35,39 15,33 0,36 Z" fill="#128807"/>
      <!-- Ashoka Chakra -->
      <circle cx="26" cy="18" r="4.5" fill="none" stroke="#000088" stroke-width="1"/>
      <circle cx="26" cy="18" r="1.2" fill="#000088"/>
    </g>
  </g>
</svg>
